[project]
name = "jogg-avatar-v2v-1-3b"
version = "0.1.0"
description = "InfiniteTalk audio-driven video-to-video avatar generation based on Wan2.1-T2V-1.3B"
readme = "README.md"
requires-python = "==3.13.*"
license = { file = "LICENSE" }
authors = [{ name = "Jogg-Avatar contributors" }]
dependencies = [
    "accelerate>=1.1,<2",
    "decord>=0.6,<0.7",
    "diffusers==0.36.0",
    "easydict>=1.13,<2",
    "einops==0.8.1",
    "ftfy==6.3.1",
    "huggingface-hub[cli]>=0.34,<1",
    "imageio[ffmpeg]>=2.37,<3",
    "librosa==0.10.2",
    "loguru>=0.7,<0.8",
    "moviepy==1.0.3",
    "numpy>=1.26,<2",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-curand-cu12==10.3.9.90",
    "opencv-python>=4.9,<5",
    "optimum-quanto==0.2.6",
    "peft==0.18.1",
    "pillow>=10,<13",
    "pyloudnorm>=0.2,<0.3",
    "safetensors>=0.7,<0.8",
    "scenedetect>=0.6.7,<0.7",
    "scikit-image>=0.26,<0.27",
    "scipy==1.15.3",
    "sentencepiece>=0.2,<0.3",
    "soundfile>=0.13,<0.14",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.67,<5",
    "transformers==4.57.6",
    "xfuser==0.4.5",
    "xformers==0.0.32.post2",
]

[project.optional-dependencies]
preprocess = [
    "apstone>=0.0.8,<0.1",
    "cv2box>=0.6,<0.7",
    "onnxruntime-gpu>=1.24.1,<2",
]
train = [
    "lightning==2.6.5",
    "tensorboard>=2.20,<3",
]
deepspeed = ["deepspeed>=0.17,<0.19"]
build = ["ninja>=1.13,<2"]
test = ["pytest>=8.4,<9"]

[tool.uv]
package = false
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
nvidia-cudnn-cu12 = { index = "pytorch-cu128" }
nvidia-cublas-cu12 = { index = "pytorch-cu128" }
nvidia-curand-cu12 = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"
